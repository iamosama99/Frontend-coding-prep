<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frontend Interview Prep — 130+ Questions</title>
<style>
  :root {
    --red:#E24B4A; --amber:#EF9F27; --green:#1D9E75;
    --bg:#ffffff; --bg2:#f5f5f3;
    --txt:#1a1a1a; --txt2:#666; --txt3:#999;
    --bdr:rgba(0,0,0,0.1); --bdr2:rgba(0,0,0,0.2);
    --r:8px; --mono:'SF Mono','Fira Code','Cascadia Code',monospace;
  }
  @media(prefers-color-scheme:dark){:root{
    --bg:#1a1a1a; --bg2:#242424;
    --txt:#f0f0f0; --txt2:#aaa; --txt3:#666;
    --bdr:rgba(255,255,255,0.1); --bdr2:rgba(255,255,255,0.2);
  }}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);padding-bottom:4rem}
  header{background:var(--bg);border-bottom:1px solid var(--bdr);padding:1rem 1.25rem;position:sticky;top:0;z-index:100}
  .htop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:.7rem}
  h1{font-size:16px;font-weight:600;letter-spacing:-.02em}
  .sub{font-size:12px;color:var(--txt3);margin-top:2px}
  .pp{display:flex;align-items:center;gap:7px;margin-left:auto}
  .ptxt{font-size:12px;color:var(--txt2);white-space:nowrap}
  .pbar{width:72px;height:5px;background:var(--bdr);border-radius:3px;overflow:hidden}
  .pfil{height:100%;background:var(--green);border-radius:3px;transition:width .3s}
  .rbtn{border:1px solid var(--bdr2);border-radius:var(--r);padding:5px 11px;font-size:12px;color:var(--txt2);background:transparent;cursor:pointer;font-family:inherit}
  .rbtn:hover{background:var(--bg2)}
  .sbox{width:100%;height:36px;display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r);padding:0 12px;margin-bottom:.55rem}
  .sbox input{border:none;background:transparent;outline:none;font-size:14px;color:var(--txt);width:100%;font-family:inherit}
  .sbox input::placeholder{color:var(--txt3)}
  .frow{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:.4rem}
  .chip{cursor:pointer;padding:4px 10px;border-radius:20px;font-size:12px;border:1px solid var(--bdr);color:var(--txt2);background:transparent;font-family:inherit;transition:all .15s;white-space:nowrap;line-height:1.6}
  .chip:hover{background:var(--bg2)}
  .chip.on{background:var(--txt);color:var(--bg);border-color:var(--txt)}
  .chip.cm.on{background:#A32D2D;border-color:#A32D2D;color:#fff}
  .chip.ci.on{background:#854F0B;border-color:#854F0B;color:#fff}
  .chip.cl.on{background:#3C3489;border-color:#3C3489;color:#fff}
  .chip.cmc.on{background:#085041;border-color:#085041;color:#fff}
  .legend{display:flex;gap:12px;padding:.5rem 1.25rem;border-bottom:1px solid var(--bdr);flex-wrap:wrap}
  .li{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--txt3)}
  .dot{width:9px;height:9px;border-radius:2px;flex-shrink:0}
  main{max-width:940px;margin:0 auto;padding:1.25rem}
  .sec{margin-bottom:1.75rem}
  .sh{display:flex;align-items:center;gap:8px;margin-bottom:9px;padding-bottom:7px;border-bottom:1px solid var(--bdr)}
  .slbl{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--txt2)}
  .scnt{margin-left:auto;font-size:11px;color:var(--txt3)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  @media(max-width:580px){.grid{grid-template-columns:1fr}}
  .card{display:flex;align-items:flex-start;gap:0;padding:8px 10px 8px 0;border-radius:var(--r);border:1px solid var(--bdr);background:var(--bg);cursor:pointer;border-left:3px solid var(--bdr);transition:border-color .15s}
  .card:hover{border-color:var(--bdr2);border-left-color:inherit}
  .card.must{border-left-color:var(--red)}
  .card.imp{border-left-color:var(--amber)}
  .card.nice{border-left-color:var(--bdr2)}
  .card.done{opacity:.38}
  .card.done .qn{text-decoration:line-through;text-decoration-color:var(--txt3)}
  .ck{width:16px;height:16px;border-radius:3px;border:1.5px solid var(--bdr2);flex-shrink:0;margin-top:2px;margin-left:9px;margin-right:8px;display:flex;align-items:center;justify-content:center;transition:all .15s}
  .card.done .ck{background:var(--green);border-color:var(--green)}
  .bd{flex:1;min-width:0}
  .qn{font-size:13px;color:var(--txt);font-weight:500;font-family:var(--mono);line-height:1.35}
  .qh{font-size:11px;color:var(--txt3);margin-top:3px;line-height:1.45}
  .tags{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px}
  .tag{font-size:10px;padding:1px 6px;border-radius:7px;font-weight:500;line-height:1.6}
  .hard{background:#F5C4B3;color:#712B13}
  .med{background:#FAC775;color:#412402}
  .easy{background:#C0DD97;color:#173404}
  .live{background:#CECBF6;color:#26215C}
  .machine{background:#9FE1CB;color:#04342C}
  .both{background:#B5D4F4;color:#042C53}
  .empty{text-align:center;padding:3rem;color:var(--txt3)}
</style>
</head>
<body>
<header>
  <div class="htop">
    <div><h1>Frontend Interview Prep</h1><div class="sub">130+ questions · sorted by importance</div></div>
    <div class="pp">
      <span class="ptxt"><strong id="pn">0/0</strong> done</span>
      <div class="pbar"><div class="pfil" id="pf" style="width:0%"></div></div>
    </div>
    <button class="rbtn" onclick="done.clear();render()">Reset all</button>
  </div>
  <div class="sbox">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="opacity:.4;flex-shrink:0"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="srch" placeholder="Search questions…" oninput="render()">
  </div>
  <div class="frow" id="fc"></div>
  <div class="frow" id="fi"></div>
  <div class="frow" id="fr"></div>
</header>
<div class="legend">
  <div class="li"><div class="dot" style="background:var(--red)"></div>Must know</div>
  <div class="li"><div class="dot" style="background:var(--amber)"></div>Important</div>
  <div class="li"><div class="dot" style="background:var(--bdr2)"></div>Nice to have</div>
  <div class="li"><div class="dot" style="background:#CECBF6"></div>Live interview</div>
  <div class="li"><div class="dot" style="background:#9FE1CB"></div>Machine round</div>
  <div class="li"><div class="dot" style="background:#B5D4F4"></div>Both rounds</div>
</div>
<main><div id="lst"></div></main>
<script>

  ['hooks','useLocalStorage','JSON.parse/stringify, storage event, SSR window guard','easy','must','both'],

  ['hooks','useWhyDidYouUpdate','useRef prev props, JSON compare, console.log diffs','hard','nice','live'],

  ['ui','Toggle switch','Checkbox underneath, CSS pill track, animated sliding thumb','easy','must','machine'],

  ['ui','Copy-to-clipboard button','navigator.clipboard.writeText, transient "Copied!" feedback','easy','must','machine'],
  ['ui','Back-to-top button','Show after scroll threshold, smooth scroll, keyboard a11y','easy','must','machine'],

  ['ui','Star rating','Hover preview, half-stars, keyboard accessible','easy','must','machine'],

  ['ui','Sortable table','Click header to sort asc/desc, indicator arrow, stable sort','easy','must','machine'],
  ['ui','Infinite scroll','IntersectionObserver on sentinel div, page cursor','med','must','machine'],
  ['ui','Tabs component','Compound component, ARIA tablist/tab/tabpanel roles','med','must','machine'],

  ['ui','Canvas signature pad','pointerdown/move/up, getContext 2d, toDataURL export','hard','nice','machine'],

  ['js','Group array by key','reduce to object, Array.prototype.groupBy shim','easy','must','live'],
  ['js','once(fn) utility','Called flag in closure, null out fn after first call','easy','must','live'],
  ['js','chunk(array, size)','for loop, array.slice(i, i + size) per iteration','easy','must','live'],

  ['js','Promise.race from scratch','First settled promise — resolve or reject — wins','hard','must','live'],
  ['js','Function.prototype.bind polyfill','Closure + apply, handle `new` keyword edge case','hard','must','live'],

  ['js','Array intersection / difference','Set for O(1) lookup, filter + has()','easy','imp','live'],
  ['js','Deep merge objects','Recursive Object.assign, handle arrays by strategy','med','imp','live'],

let fC='all',fI='all',fR='all';
const done=new Set();
function srt(a,b){const d=IR[b[4]]-IR[a[4]];return d!==0?d:DR[a[3]]-DR[b[3]];}

function bld(){
  const cnt={};CATS.forEach(c=>{cnt[c.id]=Q.filter(x=>x[0]===c.id).length;});
  document.getElementById('fc').innerHTML=
    `<button class="chip${fC==='all'?' on':''}" onclick="fC='all';bld();render()">All (${Q.length})</button>`+
    CATS.map(c=>`<button class="chip${fC===c.id?' on':''}" onclick="fC='${c.id}';bld();render()">${c.ic} ${c.lbl} (${cnt[c.id]})</button>`).join('');
  document.getElementById('fi').innerHTML=
    [['all','All levels',''],['must','Must know','cm'],['imp','Important','ci'],['nice','Nice to have','']]
    .map(([v,l,x])=>`<button class="chip ${x}${fI===v?' on':''}" onclick="fI='${v}';bld();render()">${l}</button>`).join('');
  document.getElementById('fr').innerHTML=
    [['all','All rounds',''],['live','Live interview','cl'],['machine','Machine round','cmc']]
    .map(([v,l,x])=>`<button class="chip ${x}${fR===v?' on':''}" onclick="fR='${v}';bld();render()">${l}</button>`).join('');
}

function render(){
  const q=(document.getElementById('srch').value||'').toLowerCase();
  const vis=Q.filter(x=>{
    if(fC!=='all'&&x[0]!==fC)return false;
    if(fI!=='all'&&x[4]!==fI)return false;
    if(fR==='live'&&x[5]==='machine')return false;
    if(fR==='machine'&&x[5]==='live')return false;
    return !q||x[1].toLowerCase().includes(q)||x[2].toLowerCase().includes(q);
  });
  document.getElementById('pn').textContent=done.size+'/'+Q.length;
  document.getElementById('pf').style.width=Math.round(done.size/Q.length*100)+'%';
  const grp={};CATS.forEach(c=>{grp[c.id]=[];});
  vis.forEach(x=>{if(grp[x[0]])grp[x[0]].push(x);});
  let html='';
  CATS.forEach(cat=>{
    const qs=[...grp[cat.id]].sort(srt);
    if(!qs.length)return;
    const dc=qs.filter(x=>done.has(x[1])).length;
    html+=`<div class="sec"><div class="sh"><span style="font-size:15px">${cat.ic}</span><span class="slbl">${cat.lbl}</span><span class="scnt">${dc}/${qs.length} done</span></div><div class="grid">`;
    qs.forEach(x=>{
      const d=done.has(x[1]);
      const rl=x[5]==='both'?'live + machine':x[5];
      const esc=x[1].replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      html+=`<div class="card ${x[4]}${d?' done':''}" onclick="tog('${esc}')">
<div class="ck">${d?'<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.5"><polyline points="20 6 9 17 4 12"/></svg>':''}</div>
<div class="bd"><div class="qn">${x[1]}</div><div class="qh">${x[2]}</div>
<div class="tags"><span class="tag ${x[3]}">${x[3]}</span><span class="tag ${x[5]}">${rl}</span></div></div></div>`;
    });
    html+='</div></div>';
  });
  document.getElementById('lst').innerHTML=html||'<div class="empty"><div style="font-size:2rem;margin-bottom:.5rem">🔍</div><p>No questions match your filters</p></div>';
}
function tog(name){done.has(name)?done.delete(name):done.add(name);render();}
bld();render();
</script>
</body>
</html>
