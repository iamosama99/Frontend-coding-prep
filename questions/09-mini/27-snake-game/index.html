<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Game</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }

    .score-bar {
      display: flex;
      gap: 2rem;
      margin-bottom: 1rem;
    }
    .score-item { text-align: center; }
    .score-item .label { font-size: 0.72rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; }
    .score-item .value { font-size: 1.5rem; font-weight: 700; color: #34d399; }

    /* Canvas wrapper for overlay positioning */
    .canvas-wrapper {
      position: relative;
      border: 3px solid #334155;
      border-radius: 4px;
    }

    canvas {
      display: block;
      background: #1e293b;
    }

    /* Game over / start overlay */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      border-radius: 2px;
    }
    .overlay.hidden { display: none; }

    .overlay h2 { font-size: 1.6rem; }
    .overlay p  { color: #94a3b8; }

    .btn {
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0.75rem 2rem;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 0.5rem;
    }
    .btn:hover { background: #4f46e5; }

    .controls-hint {
      margin-top: 1rem;
      color: #475569;
      font-size: 0.82rem;
      text-align: center;
    }
  </style>
</head>
<body>

      <div class="label">Score</div>

    </div>

      <p id="overlay-msg">Use arrow keys to move</p>
      <button class="btn" id="btn-start">Start Game</button>
    </div>
  </div>

  <div class="controls-hint">Arrow keys to move &nbsp;·&nbsp; Tab to pause</div>
