<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Gallery + Lightbox</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; padding: 2rem; }

    h1 { font-size: 1.75rem; margin-bottom: 1.5rem; }

    /* Grid */
    #gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }

    .thumb {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      transition: transform .2s, opacity .2s;
    }

    .thumb:hover { transform: scale(1.03); opacity: .9; }

    /* Lightbox */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.85);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity .3s;
    }

    #lightbox.open {
      display: flex;
      /* JS will add opacity:1 after display:flex kicks in */
    }

    #lightbox.visible { opacity: 1; }

    .lb-content {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .75rem;
    }

    #lbImage {
      max-width: 100%;
      max-height: 80vh;
      border-radius: 8px;
      object-fit: contain;
    }

    #lbCaption { font-size: .9rem; color: #cbd5e1; }

    .lb-btn {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,.15);
      border: none;
      color: #fff;
      font-size: 1.75rem;
      padding: .6rem 1rem;
      cursor: pointer;
      border-radius: 8px;
      transition: background .2s;
      line-height: 1;
    }

    .lb-btn:hover { background: rgba(255,255,255,.3); }

    #prevBtn { left: 1.5rem; }
    #nextBtn { right: 1.5rem; }

    #closeBtn {
      position: fixed;
      top: 1.25rem;
      right: 1.5rem;
      background: rgba(255,255,255,.15);
      border: none;
      color: #fff;
      font-size: 1.5rem;
      padding: .35rem .75rem;
      cursor: pointer;
      border-radius: 8px;
      line-height: 1;
    }

    #closeBtn:hover { background: rgba(255,255,255,.3); }
  </style>
</head>
