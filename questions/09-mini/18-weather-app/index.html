<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather App</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: linear-gradient(135deg, #1e3a5f 0%, #3b82f6 100%);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 3rem 1.5rem;
      color: #fff;
    }

    .container { width: 100%; max-width: 440px; }

    h1 { font-size: 1.75rem; margin-bottom: 1.5rem; text-align: center; }

    /* Search */
    .search-row { display: flex; gap: .6rem; margin-bottom: 1.5rem; }

    #cityInput {
      flex: 1;
      padding: .7rem 1rem;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      background: rgba(255,255,255,.2);
      color: #fff;
    }

    #cityInput::placeholder { color: rgba(255,255,255,.6); }
    #cityInput:focus { background: rgba(255,255,255,.3); }

    #searchBtn {
      padding: .7rem 1.2rem;
      background: #fff;
      color: #1e3a5f;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: .95rem;
      cursor: pointer;
    }

    #searchBtn:hover { background: #e0e7ff; }

    /* Status */
    #status { text-align: center; opacity: .8; font-size: .95rem; min-height: 1.5rem; }

    /* Weather card */
    #weatherCard {
      display: none;
      background: rgba(255,255,255,.15);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 2rem;
      text-align: center;
      margin-top: 1.5rem;
    }

    #weatherIcon  { font-size: 4rem; margin-bottom: .5rem; }
    #cityName     { font-size: 1.4rem; font-weight: 700; }
    #weatherDesc  { font-size: 1rem; opacity: .8; margin-bottom: 1rem; }
    #tempDisplay  { font-size: 3.5rem; font-weight: 700; margin-bottom: .25rem; }
    #windDisplay  { font-size: .95rem; opacity: .75; margin-bottom: 1.25rem; }

    #toggleUnit {
      padding: .4rem 1.1rem;
      border: 2px solid rgba(255,255,255,.5);
      border-radius: 99px;
      background: transparent;
      color: #fff;
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
    }

    #toggleUnit:hover { background: rgba(255,255,255,.15); }
  </style>
</head>
