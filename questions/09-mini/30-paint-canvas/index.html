<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paint Canvas</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: system-ui, sans-serif;
      background: #0f172a;
    }

    /* Toolbar */
    .toolbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0 1rem;
      z-index: 10;
    }

    .tool-label {
      font-size: 0.75rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    /* Color picker */
    input[type="color"] {
      width: 36px;
      height: 36px;
      border: 2px solid #334155;
      border-radius: 8px;
      background: none;
      cursor: pointer;
      padding: 2px;
    }

    /* Brush size */
    .brush-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    input[type="range"] {
      width: 90px;
      accent-color: #6366f1;
      cursor: pointer;
    }
    .size-preview {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .size-dot {
      background: #f1f5f9;
      border-radius: 50%;
      transition: width 0.1s, height 0.1s;
    }

    /* Buttons */
    .btn-tool {
      background: #334155;
      color: #f1f5f9;
      border: none;
      border-radius: 8px;
      padding: 0.4rem 0.85rem;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .btn-tool:hover { background: #475569; }
    .btn-tool.active { background: #6366f1; }

    /* Canvas */
    canvas {
      position: fixed;
      top: 56px;
      left: 0;
      background: #fff;
      cursor: crosshair;
      touch-action: none; /* prevent scroll during touch drawing */
    }
    canvas.eraser { cursor: cell; }
  </style>
</head>
