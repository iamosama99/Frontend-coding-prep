<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes App</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f1f5f9;
      min-height: 100vh;
      padding: 2rem;
    }

    .container { max-width: 700px; margin: 0 auto; }

    h1 { font-size: 1.75rem; color: #0f172a; margin-bottom: 1.25rem; }

    /* Search + new note bar */
    .top-bar { display: flex; gap: .75rem; margin-bottom: 1.5rem; }

    #searchInput {
      flex: 1;
      padding: .65rem 1rem;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color .2s;
    }

    #searchInput:focus { border-color: #6366f1; }

    #newNoteBtn {
      padding: .65rem 1.2rem;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    #newNoteBtn:hover { background: #4f46e5; }

    /* Note form */
    #noteForm {
      display: none;
      background: #fff;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 2px 12px rgba(0,0,0,.07);
      margin-bottom: 1.5rem;
    }

    #noteForm input, #noteForm textarea {
      width: 100%;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      padding: .6rem .9rem;
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: border-color .2s;
    }

    #noteForm input:focus, #noteForm textarea:focus { border-color: #6366f1; }

    #noteForm input { margin-bottom: .75rem; font-weight: 600; }
    #noteForm textarea { min-height: 120px; resize: vertical; }

    .form-error { font-size: .8rem; color: #ef4444; margin-top: .3rem; }

    .form-actions { display: flex; gap: .75rem; margin-top: 1rem; justify-content: flex-end; }

    .form-actions button {
      padding: .5rem 1.2rem;
      border: none;
      border-radius: 8px;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
    }

    #saveBtn   { background: #6366f1; color: #fff; }
    #cancelBtn { background: #e2e8f0; color: #374151; }

    /* Notes list */
    #notesList { display: flex; flex-direction: column; gap: .9rem; }

    .note-card {
      background: #fff;
      border-radius: 12px;
      padding: 1.1rem 1.25rem;
      box-shadow: 0 2px 8px rgba(0,0,0,.05);
      cursor: pointer;
      transition: box-shadow .2s;
    }

    .note-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.1); }

    .note-header { display: flex; justify-content: space-between; align-items: flex-start; }

    .note-title { font-weight: 700; color: #0f172a; font-size: 1rem; }
    .note-time  { font-size: .75rem; color: #94a3b8; white-space: nowrap; margin-left: 1rem; }
    .note-preview { font-size: .88rem; color: #64748b; margin-top: .35rem; }

    .note-footer { display: flex; justify-content: flex-end; gap: .5rem; margin-top: .75rem; }

    .note-footer button {
      padding: .3rem .75rem;
      border: none;
      border-radius: 6px;
      font-size: .8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .edit-btn   { background: #ede9fe; color: #6d28d9; }
    .delete-btn { background: #fee2e2; color: #b91c1c; }

    .empty-state {
      text-align: center;
      color: #94a3b8;
      padding: 3rem 0;
      font-size: 1rem;
    }
  </style>
</head>
