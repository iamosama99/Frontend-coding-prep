<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Character & Word Counter — Solution</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 32px;
      width: 100%;
      max-width: 560px;
    }

    h1 { font-size: 1.3rem; color: #1e293b; margin-bottom: 4px; }
    .subtitle { font-size: 0.85rem; color: #64748b; margin-bottom: 20px; }

    textarea {
      width: 100%;
      height: 180px;
      padding: 14px;
      font-size: 1rem;
      font-family: inherit;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      resize: vertical;
      outline: none;
      line-height: 1.6;
      color: #1e293b;
      transition: border-color 0.2s;
    }

    textarea:focus { border-color: #4f46e5; }

    .remaining-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-top: 10px;
      gap: 8px;
    }

    .remaining-count {
      font-size: 0.9rem;
      font-weight: 600;
      color: #64748b;
      transition: color 0.2s;
    }

    .remaining-count.warning { color: #ef4444; font-weight: 700; }

    .over-limit-msg { font-size: 0.8rem; color: #ef4444; min-height: 18px; }

    .progress-track {
      height: 4px;
      background: #e2e8f0;
      border-radius: 2px;
      margin-top: 6px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: #4f46e5;
      border-radius: 2px;
      transition: width 0.15s, background 0.15s;
    }

    .stats {
      display: flex;
      gap: 20px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .stat { display: flex; flex-direction: column; gap: 2px; }

    .stat-value { font-size: 1.4rem; font-weight: 700; color: #1e293b; }
    .stat-label {
      font-size: 0.75rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .actions { margin-top: 16px; display: flex; justify-content: flex-end; }

    .copy-btn {
      padding: 8px 20px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.15s;
      min-width: 80px;
    }

    .copy-btn:hover { background: #4338ca; }
    .copy-btn.copied { background: #16a34a; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Character & Word Counter</h1>
    <p class="subtitle">Limit: 280 characters</p>

    <textarea id="textarea" placeholder="Start typing..."></textarea>

    <div class="remaining-bar">
      <span class="over-limit-msg" id="over-limit-msg"></span>
      <span class="remaining-count" id="remaining-count">280 left</span>
    </div>

    <div class="progress-track">
      <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
    </div>

    <div class="stats">
      <div class="stat">
        <span class="stat-value" id="char-count">0</span>
        <span class="stat-label">Characters</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="word-count">0</span>
        <span class="stat-label">Words</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="line-count">1</span>
        <span class="stat-label">Lines</span>
      </div>
    </div>

    <div class="actions">
      <button class="copy-btn" id="copy-btn">Copy</button>
    </div>
  </div>

  <script>
    const MAX_CHARS      = 280;
    const WARN_THRESHOLD = 20;

    const textarea    = document.getElementById('textarea');
    const charCountEl = document.getElementById('char-count');
    const wordCountEl = document.getElementById('word-count');
    const lineCountEl = document.getElementById('line-count');
    const remainingEl = document.getElementById('remaining-count');
    const progressFill = document.getElementById('progress-fill');
    const overLimitMsg = document.getElementById('over-limit-msg');
    const copyBtn      = document.getElementById('copy-btn');

    function countWords(text) {
      const trimmed = text.trim();
      if (!trimmed) return 0;
      return trimmed.split(/\s+/).length;
    }

    function countLines(text) {
      return text.split('\n').length;
    }

    function update() {
      const text      = textarea.value;
      const charCount = text.length;
      const wordCount = countWords(text);
      const lineCount = countLines(text);
      const remaining = MAX_CHARS - charCount;

      charCountEl.textContent = charCount;
      wordCountEl.textContent = wordCount;
      lineCountEl.textContent = lineCount;

      // Remaining counter
      if (remaining >= 0) {
        remainingEl.textContent = `${remaining} left`;
      } else {
        remainingEl.textContent = `${Math.abs(remaining)} over`;
      }
      remainingEl.classList.toggle('warning', remaining < WARN_THRESHOLD);

      // Over-limit message
      if (charCount > MAX_CHARS) {
        overLimitMsg.textContent = `${charCount - MAX_CHARS} character${charCount - MAX_CHARS !== 1 ? 's' : ''} over the limit`;
      } else {
        overLimitMsg.textContent = '';
      }

      // Progress bar
      const pct = Math.min((charCount / MAX_CHARS) * 100, 100);
      progressFill.style.width = pct + '%';
      progressFill.style.background = charCount > MAX_CHARS ? '#ef4444' : '#4f46e5';
    }

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(textarea.value);
        copyBtn.textContent = 'Copied!';
        copyBtn.classList.add('copied');
        setTimeout(() => {
          copyBtn.textContent = 'Copy';
          copyBtn.classList.remove('copied');
        }, 2000);
      } catch (err) {
        console.error('Copy failed:', err);
      }
    });

    textarea.addEventListener('input', update);

    update();
  </script>
</body>
</html>
