<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 2rem;
    }

    h1 { font-size: 2rem; letter-spacing: .05em; }

    #status {
      font-size: 1.25rem;
      font-weight: 600;
      min-height: 2rem;
      color: #94a3b8;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-template-rows: repeat(3, 100px);
      gap: 8px;
    }

    .cell {
      background: #1e293b;
      border-radius: 10px;
      font-size: 2.5rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background .15s;
      user-select: none;
    }

    .cell:hover:empty { background: #334155; }
    .cell[data-player="X"] { color: #f472b6; }
    .cell[data-player="O"] { color: #38bdf8; }
    .cell.winner { background: #164e63; }

    .scores {
      display: flex;
      gap: 2rem;
      font-size: .9rem;
      color: #94a3b8;
    }

    .score-box { text-align: center; }
    .score-box .label { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; }
    .score-box .value { font-size: 1.75rem; font-weight: 700; color: #e2e8f0; }

    .buttons { display: flex; gap: 1rem; }

    button {
      padding: .55rem 1.4rem;
      border: none;
      border-radius: 8px;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s;
    }

    button:hover { opacity: .85; }

    #resetBtn      { background: #6366f1; color: #fff; }
    #resetScoreBtn { background: #334155; color: #e2e8f0; }
  </style>
</head>
