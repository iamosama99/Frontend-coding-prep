<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Memory Match Game</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    h1 { font-size: 1.8rem; margin-bottom: 0.4rem; }
    .subtitle { color: #94a3b8; margin-bottom: 1.5rem; }

    /* Stats bar */
    .stats {
      display: flex;
      gap: 2rem;
      margin-bottom: 1.5rem;
    }
    .stat { text-align: center; }
    .stat .label { font-size: 0.75rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; }
    .stat .value { font-size: 1.5rem; font-weight: 700; color: #818cf8; }

    /* Card grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    /* Card flip effect */
    .card {
      width: 80px;
      height: 80px;
      perspective: 600px;
      cursor: pointer;
    }
    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.4s;
    }
    .card.flipped .card-inner,
    .card.matched .card-inner { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      backface-visibility: hidden;
    }
    .card-back {
      background: #1e293b;
      border: 2px solid #334155;
    }
    .card-front {
      background: #312e81;
      border: 2px solid #4338ca;
      transform: rotateY(180deg);
    }
    .card.matched .card-front {
      background: #14532d;
      border-color: #16a34a;
    }

    /* Victory overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .overlay.hidden { display: none; }

    .victory-card {
      background: #1e293b;
      border-radius: 20px;
      padding: 2.5rem;
      text-align: center;
      max-width: 340px;
    }
    .victory-card h2 { font-size: 1.8rem; margin-bottom: 0.5rem; }
    .victory-stats { color: #94a3b8; margin-bottom: 1.5rem; line-height: 1.8; }
    .victory-stats strong { color: #f1f5f9; }

    .btn {
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0.75rem 2rem;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: #4f46e5; }
  </style>
</head>
