<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1rem;
    }

    h1 { font-size: 2rem; margin-bottom: 0.4rem; }
    .subtitle { color: #94a3b8; margin-bottom: 2.5rem; }

    /* Input card */
    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 1.75rem;
      width: 100%;
      max-width: 560px;
      margin-bottom: 2rem;
    }

    .input-row {
      display: flex;
      gap: 0.75rem;
    }

    input[type="url"], input[type="text"] {
      flex: 1;
      background: #0f172a;
      border: 1.5px solid #334155;
      border-radius: 8px;
      color: #f1f5f9;
      padding: 0.7rem 1rem;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="url"]:focus, input[type="text"]:focus { border-color: #6366f1; }
    input[type="url"].error { border-color: #f87171; }

    .error-msg {
      color: #f87171;
      font-size: 0.82rem;
      margin-top: 0.4rem;
      min-height: 1.1em;
    }

    .btn {
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.7rem 1.3rem;
      font-size: 0.95rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .btn:hover { background: #4f46e5; }

    /* History */
    .history-title {
      font-size: 0.85rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.75rem;
      width: 100%;
      max-width: 560px;
    }

    #history-list {
      list-style: none;
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    #history-list li {
      background: #1e293b;
      border-radius: 10px;
      padding: 0.85rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      position: relative;
    }

    .short-link {
      color: #818cf8;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
    }
    .short-link:hover { text-decoration: underline; }

    .long-url {
      color: #64748b;
      font-size: 0.78rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 380px;
    }

    .item-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.2rem;
    }

    .btn-copy {
      background: #334155;
      color: #f1f5f9;
      border: none;
      border-radius: 6px;
      padding: 0.3rem 0.75rem;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-copy:hover { background: #475569; }
    .btn-copy.copied { background: #166534; color: #bbf7d0; }

    .btn-delete {
      background: transparent;
      color: #64748b;
      border: none;
      border-radius: 6px;
      padding: 0.3rem 0.75rem;
      font-size: 0.8rem;
      cursor: pointer;
      transition: color 0.15s;
    }
    .btn-delete:hover { color: #f87171; }

    .empty-state {
      color: #475569;
      font-size: 0.9rem;
      padding: 1rem 0;
    }
  </style>
</head>
