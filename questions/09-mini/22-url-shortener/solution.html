<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener — Solution</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1rem;
    }

    h1 { font-size: 2rem; margin-bottom: 0.4rem; }
    .subtitle { color: #94a3b8; margin-bottom: 2.5rem; }

    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 1.75rem;
      width: 100%;
      max-width: 560px;
      margin-bottom: 2rem;
    }

    .input-row { display: flex; gap: 0.75rem; }

    input[type="url"], input[type="text"] {
      flex: 1;
      background: #0f172a;
      border: 1.5px solid #334155;
      border-radius: 8px;
      color: #f1f5f9;
      padding: 0.7rem 1rem;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="url"]:focus { border-color: #6366f1; }
    input[type="url"].error { border-color: #f87171; }

    .error-msg {
      color: #f87171;
      font-size: 0.82rem;
      margin-top: 0.4rem;
      min-height: 1.1em;
    }

    .btn {
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.7rem 1.3rem;
      font-size: 0.95rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .btn:hover { background: #4f46e5; }

    .history-title {
      font-size: 0.85rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.75rem;
      width: 100%;
      max-width: 560px;
    }

    #history-list {
      list-style: none;
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    #history-list li {
      background: #1e293b;
      border-radius: 10px;
      padding: 0.85rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      transition: outline 0.2s;
    }
    #history-list li.highlight { outline: 2px solid #6366f1; }

    .short-link {
      color: #818cf8;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
    }
    .short-link:hover { text-decoration: underline; }

    .long-url {
      color: #64748b;
      font-size: 0.78rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 430px;
    }

    .item-actions { display: flex; gap: 0.5rem; margin-top: 0.2rem; }

    .btn-copy {
      background: #334155;
      color: #f1f5f9;
      border: none;
      border-radius: 6px;
      padding: 0.3rem 0.75rem;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-copy:hover { background: #475569; }
    .btn-copy.copied { background: #166534; color: #bbf7d0; }

    .btn-delete {
      background: transparent;
      color: #64748b;
      border: none;
      border-radius: 6px;
      padding: 0.3rem 0.75rem;
      font-size: 0.8rem;
      cursor: pointer;
      transition: color 0.15s;
    }
    .btn-delete:hover { color: #f87171; }

    .empty-state {
      color: #475569;
      font-size: 0.9rem;
      padding: 1rem 0;
    }
  </style>
</head>
<body>
  <h1>🔗 URL Shortener</h1>
  <p class="subtitle">Generate a fake short link instantly</p>

  <div class="card">
    <div class="input-row">
      <input type="url" id="url-input" placeholder="https://example.com/very/long/url" />
      <button class="btn" id="btn-shorten">Shorten</button>
    </div>
    <div class="error-msg" id="error-msg"></div>
  </div>

  <p class="history-title">History</p>
  <ul id="history-list"></ul>

  <script>
    const STORAGE_KEY = 'url-shortener-history';
    const FAKE_DOMAIN = 'short.ly';

    let history = [];

    const urlInput    = document.getElementById('url-input');
    const btnShorten  = document.getElementById('btn-shorten');
    const errorMsg    = document.getElementById('error-msg');
    const historyList = document.getElementById('history-list');

    function generateCode() {
      const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      let code = '';
      for (let i = 0; i < 6; i++) {
        code += chars[Math.floor(Math.random() * chars.length)];
      }
      return code;
    }

    function isValidUrl(url) {
      try {
        const parsed = new URL(url);
        return parsed.protocol === 'http:' || parsed.protocol === 'https:';
      } catch {
        return false;
      }
    }

    function loadHistory() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        history = raw ? JSON.parse(raw) : [];
        if (!Array.isArray(history)) history = [];
      } catch {
        history = [];
      }
    }

    function saveHistory() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    }

    function renderHistory() {
      historyList.innerHTML = '';
      if (history.length === 0) {
        const li = document.createElement('li');
        li.className = 'empty-state';
        li.textContent = 'No URLs shortened yet';
        historyList.appendChild(li);
        return;
      }
      history.forEach(entry => {
        const li = document.createElement('li');
        li.dataset.id = entry.id;
        li.innerHTML = `
          <a class="short-link" href="${entry.longUrl}" target="_blank" rel="noopener">
            ${FAKE_DOMAIN}/${entry.code}
          </a>
          <span class="long-url" title="${entry.longUrl}">${entry.longUrl}</span>
          <div class="item-actions">
            <button class="btn-copy" data-code="${entry.code}">Copy</button>
            <button class="btn-delete" data-id="${entry.id}">Delete</button>
          </div>
        `;
        historyList.appendChild(li);
      });
    }

    function handleCopy(btn, text) {
      navigator.clipboard.writeText(text).then(() => {
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'Copy';
          btn.classList.remove('copied');
        }, 2000);
      }).catch(() => {
        btn.textContent = 'Failed';
        setTimeout(() => { btn.textContent = 'Copy'; }, 2000);
      });
    }

    function flashEntry(id) {
      const li = historyList.querySelector(`li[data-id="${id}"]`);
      if (!li) return;
      li.classList.add('highlight');
      li.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      setTimeout(() => li.classList.remove('highlight'), 1500);
    }

    function shortenUrl() {
      const longUrl = urlInput.value.trim();

      // Clear previous error
      errorMsg.textContent = '';
      urlInput.classList.remove('error');

      if (!longUrl) {
        errorMsg.textContent = 'Please enter a URL.';
        urlInput.classList.add('error');
        return;
      }
      if (!isValidUrl(longUrl)) {
        errorMsg.textContent = 'URL must start with http:// or https://';
        urlInput.classList.add('error');
        return;
      }

      // Check for duplicate
      const existing = history.find(e => e.longUrl === longUrl);
      if (existing) {
        renderHistory();
        flashEntry(existing.id);
        urlInput.value = '';
        return;
      }

      const code     = generateCode();
      const shortUrl = `${FAKE_DOMAIN}/${code}`;
      const entry    = { id: Date.now(), longUrl, code, shortUrl };
      history.unshift(entry);
      saveHistory();
      renderHistory();
      urlInput.value = '';
    }

    function deleteEntry(id) {
      history = history.filter(e => e.id !== id);
      saveHistory();
      renderHistory();
    }

    historyList.addEventListener('click', e => {
      const copyBtn   = e.target.closest('.btn-copy');
      const deleteBtn = e.target.closest('.btn-delete');
      if (copyBtn) {
        handleCopy(copyBtn, `${FAKE_DOMAIN}/${copyBtn.dataset.code}`);
      } else if (deleteBtn) {
        deleteEntry(Number(deleteBtn.dataset.id));
      }
    });

    btnShorten.addEventListener('click', shortenUrl);
    urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') shortenUrl(); });

    loadHistory();
    renderHistory();
  </script>
</body>
</html>
