<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz App</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      padding: 2rem 2.5rem;
      width: 100%;
      max-width: 560px;
    }

    /* Progress */
    .progress-bar-track {
      height: 8px;
      background: #e2e8f0;
      border-radius: 99px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }

    #progressBar {
      height: 100%;
      background: #6366f1;
      border-radius: 99px;
      transition: width .3s;
      width: 0%;
    }

    #questionCounter {
      font-size: .8rem;
      color: #94a3b8;
      text-align: right;
      margin-top: -.8rem;
      margin-bottom: 1.2rem;
    }

    /* Question */
    #questionText {
      font-size: 1.15rem;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 1.25rem;
      line-height: 1.5;
    }

    #options { display: flex; flex-direction: column; gap: .7rem; }

    .option {
      padding: .75rem 1rem;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      cursor: pointer;
      font-size: .95rem;
      transition: border-color .15s, background .15s;
      user-select: none;
    }

    .option:hover    { border-color: #818cf8; background: #eef2ff; }
    .option.selected { border-color: #6366f1; background: #eef2ff; font-weight: 600; }

    /* Navigation */
    .nav {
      display: flex;
      justify-content: space-between;
      margin-top: 1.75rem;
      gap: 1rem;
    }

    button {
      padding: .6rem 1.4rem;
      border: none;
      border-radius: 8px;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s;
    }

    button:disabled { opacity: .4; cursor: not-allowed; }
    button:not(:disabled):hover { opacity: .85; }

    #prevBtn   { background: #e2e8f0; color: #1e293b; }
    #nextBtn   { background: #6366f1; color: #fff;    margin-left: auto; }

    /* Results */
    #results { display: none; }

    #scoreText {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .review-item {
      margin-bottom: 1.2rem;
      padding: .9rem 1rem;
      border-radius: 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
    }

    .review-q  { font-weight: 600; margin-bottom: .4rem; }
    .review-answer { font-size: .88rem; }
    .review-answer.correct { color: #16a34a; }
    .review-answer.wrong   { color: #dc2626; }

    #restartBtn { display: block; margin: 1.5rem auto 0; background: #6366f1; color: #fff; }
  </style>
</head>
