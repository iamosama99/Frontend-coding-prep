<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo List</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px;
    }

    .app {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      width: 100%;
      max-width: 480px;
      overflow: hidden;
    }

    .app-header {
      background: #4f46e5;
      color: #fff;
      padding: 24px;
    }

    .app-header h1 { font-size: 1.6rem; margin-bottom: 16px; }

    .input-row {
      display: flex;
      gap: 8px;
    }

    .input-row input {
      flex: 1;
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }

    .input-row button {
      padding: 10px 18px;
      background: #6d28d9;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }

    .input-row button:hover { background: #5b21b6; }

    .filters {
      display: flex;
      border-bottom: 1px solid #e5e7eb;
    }

    .filters button {
      flex: 1;
      padding: 12px;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      font-size: 0.9rem;
      cursor: pointer;
      color: #6b7280;
      transition: all 0.15s;
    }

    .filters button.active {
      color: #4f46e5;
      border-bottom-color: #4f46e5;
      font-weight: 600;
    }

    .todo-list {
      list-style: none;
      min-height: 60px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      border-bottom: 1px solid #f3f4f6;
      transition: background 0.1s;
    }

    .todo-item:hover { background: #f9fafb; }

    .todo-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #4f46e5;
    }

    .todo-item .todo-text {
      flex: 1;
      font-size: 1rem;
      color: #111827;
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: #9ca3af;
    }

    .todo-item .delete-btn {
      background: none;
      border: none;
      color: #d1d5db;
      font-size: 1.2rem;
      cursor: pointer;
      line-height: 1;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .todo-item .delete-btn:hover { color: #ef4444; background: #fee2e2; }

    .empty-state {
      padding: 40px 20px;
      text-align: center;
      color: #9ca3af;
      font-size: 0.95rem;
    }

    .app-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      font-size: 0.85rem;
      color: #6b7280;
      border-top: 1px solid #e5e7eb;
      flex-wrap: wrap;
      gap: 8px;
    }

    .footer-actions { display: flex; gap: 8px; }

    .footer-actions button {
      background: none;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.8rem;
      cursor: pointer;
      color: #6b7280;
    }

    .footer-actions button:hover { background: #f3f4f6; color: #111827; }
  </style>
</head>
