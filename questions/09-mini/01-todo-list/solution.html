<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo List — Solution</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px;
    }

    .app {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      width: 100%;
      max-width: 480px;
      overflow: hidden;
    }

    .app-header {
      background: #4f46e5;
      color: #fff;
      padding: 24px;
    }

    .app-header h1 { font-size: 1.6rem; margin-bottom: 16px; }

    .input-row {
      display: flex;
      gap: 8px;
    }

    .input-row input {
      flex: 1;
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }

    .input-row button {
      padding: 10px 18px;
      background: #6d28d9;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }

    .input-row button:hover { background: #5b21b6; }

    .filters {
      display: flex;
      border-bottom: 1px solid #e5e7eb;
    }

    .filters button {
      flex: 1;
      padding: 12px;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      font-size: 0.9rem;
      cursor: pointer;
      color: #6b7280;
      transition: all 0.15s;
    }

    .filters button.active {
      color: #4f46e5;
      border-bottom-color: #4f46e5;
      font-weight: 600;
    }

    .todo-list { list-style: none; min-height: 60px; }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      border-bottom: 1px solid #f3f4f6;
      transition: background 0.1s;
    }

    .todo-item:hover { background: #f9fafb; }

    .todo-item input[type="checkbox"] {
      width: 18px; height: 18px;
      cursor: pointer;
      accent-color: #4f46e5;
    }

    .todo-item .todo-text { flex: 1; font-size: 1rem; color: #111827; }
    .todo-item.completed .todo-text { text-decoration: line-through; color: #9ca3af; }

    .todo-item .delete-btn {
      background: none;
      border: none;
      color: #d1d5db;
      font-size: 1.2rem;
      cursor: pointer;
      line-height: 1;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .todo-item .delete-btn:hover { color: #ef4444; background: #fee2e2; }

    .empty-state {
      padding: 40px 20px;
      text-align: center;
      color: #9ca3af;
      font-size: 0.95rem;
    }

    .app-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      font-size: 0.85rem;
      color: #6b7280;
      border-top: 1px solid #e5e7eb;
      flex-wrap: wrap;
      gap: 8px;
    }

    .footer-actions { display: flex; gap: 8px; }

    .footer-actions button {
      background: none;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.8rem;
      cursor: pointer;
      color: #6b7280;
    }

    .footer-actions button:hover { background: #f3f4f6; color: #111827; }
  </style>
</head>
<body>
  <div class="app">
    <div class="app-header">
      <h1>Todo List</h1>
      <div class="input-row">
        <input type="text" id="todo-input" placeholder="What needs to be done?" />
        <button id="add-btn">Add</button>
      </div>
    </div>

    <div class="filters">
      <button class="active" data-filter="all">All</button>
      <button data-filter="active">Active</button>
      <button data-filter="done">Done</button>
    </div>

    <ul class="todo-list" id="todo-list"></ul>

    <div class="app-footer">
      <span id="item-count">0 items left</span>
      <div class="footer-actions">
        <button id="complete-all-btn">Complete All</button>
        <button id="clear-completed-btn">Clear Completed</button>
      </div>
    </div>
  </div>

  <script>
    // --- State ---
    let todos = JSON.parse(localStorage.getItem('todos') || '[]');
    let currentFilter = localStorage.getItem('filter') || 'all';

    // --- DOM references ---
    const input              = document.getElementById('todo-input');
    const addBtn             = document.getElementById('add-btn');
    const todoList           = document.getElementById('todo-list');
    const itemCount          = document.getElementById('item-count');
    const filterBtns         = document.querySelectorAll('.filters button');
    const completeAllBtn     = document.getElementById('complete-all-btn');
    const clearCompletedBtn  = document.getElementById('clear-completed-btn');

    // --- Persistence ---
    function saveTodos() {
      localStorage.setItem('todos', JSON.stringify(todos));
    }

    // --- Core logic ---
    function addTodo(text) {
      const trimmed = text.trim();
      if (!trimmed) return;
      todos.push({ id: Date.now(), text: trimmed, completed: false });
      saveTodos();
      render();
    }

    function toggleTodo(id) {
      todos = todos.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
      saveTodos();
      render();
    }

    function deleteTodo(id) {
      todos = todos.filter(t => t.id !== id);
      saveTodos();
      render();
    }

    function completeAll() {
      const allDone = todos.every(t => t.completed);
      todos = todos.map(t => ({ ...t, completed: !allDone }));
      saveTodos();
      render();
    }

    function clearCompleted() {
      todos = todos.filter(t => !t.completed);
      saveTodos();
      render();
    }

    function setFilter(filter) {
      currentFilter = filter;
      localStorage.setItem('filter', filter);
      filterBtns.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === filter);
      });
      render();
    }

    function getFilteredTodos() {
      if (currentFilter === 'active') return todos.filter(t => !t.completed);
      if (currentFilter === 'done')   return todos.filter(t => t.completed);
      return todos;
    }

    // --- Render ---
    function render() {
      const filtered = getFilteredTodos();
      todoList.innerHTML = '';

      if (filtered.length === 0) {
        const li = document.createElement('li');
        li.className = 'empty-state';
        li.textContent = todos.length === 0 ? 'No todos yet — add one above!' : 'Nothing here.';
        todoList.appendChild(li);
      } else {
        filtered.forEach(todo => {
          const li = document.createElement('li');
          li.className = 'todo-item' + (todo.completed ? ' completed' : '');

          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.checked = todo.completed;
          cb.addEventListener('change', () => toggleTodo(todo.id));

          const span = document.createElement('span');
          span.className = 'todo-text';
          span.textContent = todo.text;

          const del = document.createElement('button');
          del.className = 'delete-btn';
          del.textContent = '×';
          del.addEventListener('click', () => deleteTodo(todo.id));

          li.appendChild(cb);
          li.appendChild(span);
          li.appendChild(del);
          todoList.appendChild(li);
        });
      }

      // Item count
      const activeCount = todos.filter(t => !t.completed).length;
      itemCount.textContent = `${activeCount} item${activeCount !== 1 ? 's' : ''} left`;

      // Clear completed visibility
      const hasCompleted = todos.some(t => t.completed);
      clearCompletedBtn.style.display = hasCompleted ? '' : 'none';

      // Sync filter button active state
      filterBtns.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === currentFilter);
      });
    }

    // --- Event listeners ---
    addBtn.addEventListener('click', () => {
      addTodo(input.value);
      input.value = '';
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        addTodo(input.value);
        input.value = '';
      }
    });

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => setFilter(btn.dataset.filter));
    });

    completeAllBtn.addEventListener('click', completeAll);
    clearCompletedBtn.addEventListener('click', clearCompleted);

    // --- Init ---
    render();
  </script>
</body>
</html>
