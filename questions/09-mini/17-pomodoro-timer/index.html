<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro Timer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .6s, color .6s;
    }

    body.work  { background: #450a0a; color: #fef2f2; }
    body.break { background: #052e16; color: #f0fdf4; }

    .card {
      text-align: center;
      padding: 3rem 4rem;
      border-radius: 20px;
      background: rgba(255,255,255,.07);
      box-shadow: 0 8px 32px rgba(0,0,0,.3);
      min-width: 360px;
    }

    #sessionLabel {
      font-size: .9rem;
      text-transform: uppercase;
      letter-spacing: .12em;
      opacity: .7;
      margin-bottom: .5rem;
    }

    #timer {
      font-size: 5rem;
      font-weight: 700;
      letter-spacing: .04em;
      line-height: 1;
      margin-bottom: 1.5rem;
      font-variant-numeric: tabular-nums;
    }

    .controls { display: flex; gap: .75rem; justify-content: center; margin-bottom: 1.5rem; }

    button {
      padding: .65rem 1.5rem;
      border: 2px solid rgba(255,255,255,.3);
      border-radius: 99px;
      background: transparent;
      color: inherit;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }

    button:hover { background: rgba(255,255,255,.15); }

    #startBtn { background: rgba(255,255,255,.2); }

    #pomodoroCount {
      font-size: .9rem;
      opacity: .7;
    }

    .reset-all {
      margin-top: 1rem;
      font-size: .8rem;
      opacity: .5;
      cursor: pointer;
      border: none;
      background: transparent;
      color: inherit;
      text-decoration: underline;
      padding: 0;
    }

    .reset-all:hover { opacity: .8; }
  </style>
</head>
