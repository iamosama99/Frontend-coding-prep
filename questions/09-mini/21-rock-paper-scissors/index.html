<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rock Paper Scissors</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    .subtitle { color: #94a3b8; margin-bottom: 2rem; }

    /* Score board */
    .scoreboard {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    .score-box {
      background: #1e293b;
      border-radius: 12px;
      padding: 1rem 1.5rem;
      text-align: center;
      min-width: 90px;
    }
    .score-box .label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; }
    .score-box .value { font-size: 2rem; font-weight: 700; margin-top: 0.25rem; }
    .score-box.player .value  { color: #34d399; }
    .score-box.computer .value { color: #f87171; }
    .score-box.draws .value   { color: #fbbf24; }

    /* Choice buttons */
    .choices {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .choice-btn {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 16px;
      padding: 1.25rem 1.5rem;
      font-size: 2.5rem;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s, background 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
    }
    .choice-btn span.label { font-size: 0.8rem; color: #94a3b8; }
    .choice-btn:hover { transform: scale(1.08); border-color: #6366f1; background: #1e3a5f; }
    .choice-btn:active { transform: scale(0.96); }

    /* Result area */
    .result-area {
      background: #1e293b;
      border-radius: 16px;
      padding: 1.5rem 2rem;
      text-align: center;
      min-width: 320px;
      margin-bottom: 1.5rem;
      min-height: 130px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .result-area.hidden { visibility: hidden; }

    .matchup {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 2.5rem;
      margin-bottom: 0.75rem;
    }
    .matchup .vs { font-size: 1rem; color: #64748b; }

    .result-label {
      font-size: 1.4rem;
      font-weight: 700;
    }
    .result-label.win  { color: #34d399; }
    .result-label.lose { color: #f87171; }
    .result-label.draw { color: #fbbf24; }

    .result-msg { color: #94a3b8; font-size: 0.9rem; margin-top: 0.25rem; }

    /* Animate result — add this class via JS each new round */
    @keyframes pop-in {
      0%   { opacity: 0; transform: scale(0.8); }
      60%  { transform: scale(1.05); }
      100% { opacity: 1; transform: scale(1); }
    }
    .result-area.animate { animation: pop-in 0.35s ease forwards; }

    /* History */
    .history-section { width: 100%; max-width: 360px; margin-bottom: 1.5rem; }
    .history-section h3 { font-size: 0.85rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; }
    #history-list { list-style: none; display: flex; flex-direction: column; gap: 0.4rem; }
    #history-list li {
      background: #1e293b;
      border-radius: 8px;
      padding: 0.5rem 0.75rem;
      font-size: 0.88rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #history-list li .outcome { font-weight: 600; }
    #history-list li .outcome.win  { color: #34d399; }
    #history-list li .outcome.lose { color: #f87171; }
    #history-list li .outcome.draw { color: #fbbf24; }

    /* Legend */
    .legend {
      background: #1e293b;
      border-radius: 12px;
      padding: 0.75rem 1.25rem;
      font-size: 0.82rem;
      color: #94a3b8;
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    /* Buttons */
    .btn-reset {
      background: #334155;
      color: #f1f5f9;
      border: none;
      border-radius: 8px;
      padding: 0.6rem 1.4rem;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.15s;
    }
    .btn-reset:hover { background: #475569; }
  </style>
</head>
