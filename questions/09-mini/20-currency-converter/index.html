<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Currency Converter</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      color: #1e293b;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      padding: 2rem 2.5rem;
      width: 100%;
      max-width: 440px;
    }

    h1 { font-size: 1.5rem; margin-bottom: 1.5rem; color: #0f172a; }

    /* Currency row */
    .currency-row {
      display: flex;
      gap: .75rem;
      align-items: center;
      margin-bottom: 1rem;
    }

    .currency-row select {
      flex: 0 0 100px;
      padding: .65rem .5rem;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: .95rem;
      font-weight: 600;
      color: #1e293b;
      outline: none;
      background: #f8fafc;
      cursor: pointer;
    }

    .currency-row select:focus { border-color: #6366f1; }

    .currency-row input {
      flex: 1;
      padding: .65rem .9rem;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 1.1rem;
      outline: none;
      color: #0f172a;
    }

    .currency-row input:focus { border-color: #6366f1; }
    .currency-row input:disabled { background: #f8fafc; color: #94a3b8; }

    /* Swap */
    .swap-row { text-align: center; margin-bottom: 1rem; }

    #swapBtn {
      padding: .5rem 1.5rem;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 99px;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }

    #swapBtn:disabled { opacity: .4; cursor: not-allowed; }
    #swapBtn:not(:disabled):hover { background: #4f46e5; }

    /* Meta */
    #metaInfo {
      font-size: .78rem;
      color: #94a3b8;
      margin-top: 1.25rem;
      text-align: center;
    }

    #errorMsg {
      display: none;
      color: #ef4444;
      font-size: .88rem;
      margin-top: 1rem;
      text-align: center;
    }

    #rateDisplay {
      text-align: center;
      font-size: .9rem;
      color: #6366f1;
      font-weight: 600;
      margin-top: .5rem;
    }
  </style>
</head>
