<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Infinite Photo Feed — Solution</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      padding: 2rem 1rem;
    }

    h1 { text-align: center; font-size: 1.8rem; margin-bottom: 0.4rem; }
    .subtitle { text-align: center; color: #94a3b8; margin-bottom: 2rem; }

    .photo-grid {
      columns: 3;
      column-gap: 1rem;
      max-width: 1100px;
      margin: 0 auto 1.5rem;
    }

    .photo-item {
      break-inside: avoid;
      margin-bottom: 1rem;
      position: relative;
      border-radius: 10px;
      overflow: hidden;
    }
    .photo-item img {
      width: 100%;
      display: block;
      border-radius: 10px;
      transition: transform 0.3s;
    }
    .photo-item:hover img { transform: scale(1.03); }

    .photo-caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.7));
      color: #fff;
      padding: 1rem 0.75rem 0.5rem;
      font-size: 0.85rem;
      opacity: 0;
      transition: opacity 0.25s;
      border-radius: 0 0 10px 10px;
    }
    .photo-item:hover .photo-caption { opacity: 1; }

    .spinner-container { text-align: center; padding: 1.5rem; }
    .spinner-container.hidden { display: none; }

    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid #334155;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #sentinel { height: 1px; margin-top: 1rem; }

    .end-message { text-align: center; color: #475569; padding: 2rem; display: none; }
    .end-message.visible { display: block; }

    @media (max-width: 700px) { .photo-grid { columns: 2; } }
    @media (max-width: 480px) { .photo-grid { columns: 1; } }
  </style>
</head>
<body>
  <h1>Infinite Photo Feed 📷</h1>
  <p class="subtitle">Scroll down to load more photos</p>

  <div class="photo-grid" id="photo-grid"></div>

  <div class="spinner-container hidden" id="spinner">
    <div class="spinner"></div>
  </div>

  <div class="end-message" id="end-message">You've reached the end — 120 photos loaded!</div>
  <div id="sentinel"></div>

  <script>
    const BATCH_SIZE = 12;
    const MAX_PHOTOS = 120;
    const DELAY_MS   = 800;

    let nextSeed  = 1;
    let isLoading = false;
    let observer  = null;

    const grid       = document.getElementById('photo-grid');
    const spinner    = document.getElementById('spinner');
    const sentinel   = document.getElementById('sentinel');
    const endMessage = document.getElementById('end-message');

    function photoUrl(seed) {
      return `https://picsum.photos/400/300?random=${seed}`;
    }

    function createPhotoEl(seed) {
      const item = document.createElement('div');
      item.className = 'photo-item';
      item.innerHTML = `
        <img src="${photoUrl(seed)}" alt="Photo #${seed}" loading="lazy" />
        <div class="photo-caption">Photo #${seed}</div>
      `;
      return item;
    }

    function showSpinner() { spinner.classList.remove('hidden'); }
    function hideSpinner() { spinner.classList.add('hidden'); }

    function loadBatch() {
      if (isLoading) return;
      isLoading = true;
      showSpinner();

      setTimeout(() => {
        const remaining = MAX_PHOTOS - (nextSeed - 1);
        const count     = Math.min(BATCH_SIZE, remaining);

        if (count <= 0) {
          hideSpinner();
          endMessage.classList.add('visible');
          if (observer) observer.disconnect();
          isLoading = false;
          return;
        }

        for (let i = 0; i < count; i++) {
          grid.appendChild(createPhotoEl(nextSeed));
          nextSeed++;
        }

        hideSpinner();

        if (nextSeed > MAX_PHOTOS) {
          endMessage.classList.add('visible');
          if (observer) observer.disconnect();
        }

        isLoading = false;
      }, DELAY_MS);
    }

    function setupObserver() {
      observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) loadBatch();
        });
      }, { root: null, rootMargin: '0px', threshold: 0.1 });

      observer.observe(sentinel);
    }

    // Initial load + observer
    loadBatch();
    setupObserver();
  </script>
</body>
</html>
