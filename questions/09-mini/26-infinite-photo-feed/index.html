<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Infinite Photo Feed</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      padding: 2rem 1rem;
    }

    h1 { text-align: center; font-size: 1.8rem; margin-bottom: 0.4rem; }
    .subtitle { text-align: center; color: #94a3b8; margin-bottom: 2rem; }

    /* Masonry grid using CSS columns */
    .photo-grid {
      columns: 3;
      column-gap: 1rem;
      max-width: 1100px;
      margin: 0 auto 1.5rem;
    }

    /* Each photo item breaks cleanly between columns */
    .photo-item {
      break-inside: avoid;
      margin-bottom: 1rem;
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
    }

    .photo-item img {
      width: 100%;
      display: block;
      border-radius: 10px;
      transition: transform 0.3s;
    }
    .photo-item:hover img { transform: scale(1.03); }

    /* Caption overlay shown on hover */
    .photo-caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.7));
      color: #fff;
      padding: 1rem 0.75rem 0.5rem;
      font-size: 0.85rem;
      opacity: 0;
      transition: opacity 0.25s;
      border-radius: 0 0 10px 10px;
    }
    .photo-item:hover .photo-caption { opacity: 1; }

    /* Loading spinner */
    .spinner-container {
      text-align: center;
      padding: 1.5rem;
    }
    .spinner-container.hidden { display: none; }

    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid #334155;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Sentinel div (invisible, triggers IntersectionObserver) */
    #sentinel {
      height: 1px;
      margin-top: 1rem;
    }

    /* End message */
    .end-message {
      text-align: center;
      color: #475569;
      padding: 2rem;
      display: none;
    }
    .end-message.visible { display: block; }

    @media (max-width: 700px) {
      .photo-grid { columns: 2; }
    }
    @media (max-width: 480px) {
      .photo-grid { columns: 1; }
    }
  </style>
</head>
